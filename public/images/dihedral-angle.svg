<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1.5 L7.5,4.5 L1,7.5 Z" fill="#0f172a" />
    </marker>
  </defs>

  <style>
    .bg-card { fill: #fafafa; stroke: #e2e8f0; stroke-width: 1; rx: 12px; }
    .face-left { fill: #d1d5db; stroke: #0f172a; stroke-width: 2; stroke-linejoin: round; }
    .face-right { fill: #9ca3af; stroke: #0f172a; stroke-width: 2; stroke-linejoin: round; }
    .edge-line { stroke: #0f172a; stroke-width: 2.2; stroke-linecap: round; }
    .normal-vec { stroke: #0f172a; stroke-width: 1.8; stroke-linecap: round; }
    .arc-sector { fill: #cbd5e1; stroke: #475569; stroke-width: 1.4; }
    .pt-dot { r: 5; fill: #0f172a; }
    .text-math { font-family: 'Newsreader', 'Times New Roman', Georgia, serif; font-weight: 700; font-style: normal; font-size: 20px; fill: #0f172a; }
    .text-sub { font-family: 'Newsreader', 'Times New Roman', Georgia, serif; font-size: 13px; font-weight: 700; }
    .text-phi { font-family: 'Newsreader', 'Times New Roman', Georgia, serif; font-style: italic; font-size: 18px; font-weight: 600; fill: #0f172a; }
  </style>

  <!-- Container Box -->
  <rect x="4" y="4" width="752" height="312" class="bg-card" />

  <!-- ==================== LEFT DIAGRAM (3D PERSPECTIVE) ==================== -->
  <!-- Left Face Triangle: p2(150, 65), p3(110, 235), p1(250, 175) -->
  <polygon points="150,65 110,235 250,175" class="face-left" />

  <!-- Right Face Triangle: p2(150, 65), p1(250, 175), p4(370, 195) -->
  <polygon points="150,65 250,175 370,195" class="face-right" />

  <!-- Shared Edge (p2 - p1) -->
  <line x1="150" y1="65" x2="250" y2="175" class="edge-line" />

  <!-- Normal Vector n1 (perpendicular to face 1, from (160, 160) to (60, 125)) -->
  <line x1="160" y1="160" x2="65" y2="127" class="normal-vec" marker-end="url(#arrowHead)" />

  <!-- Normal Vector n2 (perpendicular to face 2, from (280, 180) to (255, 265)) -->
  <line x1="280" y1="180" x2="256" y2="260" class="normal-vec" marker-end="url(#arrowHead)" />

  <!-- Left Diagram Vertex Dots -->
  <circle cx="150" cy="65" class="pt-dot" />
  <circle cx="110" cy="235" class="pt-dot" />
  <circle cx="250" cy="175" class="pt-dot" />
  <circle cx="370" cy="195" class="pt-dot" />

  <!-- Left Diagram Labels -->
  <!-- p2 -->
  <text x="135" y="45" class="text-math">p<tspan class="text-sub" dy="3">2</tspan></text>
  <!-- p3 -->
  <text x="95" y="255" class="text-math">p<tspan class="text-sub" dy="3">3</tspan></text>
  <!-- p1 -->
  <text x="245" y="208" class="text-math" text-anchor="middle">p<tspan class="text-sub" dy="3">1</tspan></text>
  <!-- p4 -->
  <text x="390" y="190" class="text-math">p<tspan class="text-sub" dy="3">4</tspan></text>
  <!-- n1 -->
  <text x="45" y="120" class="text-math">n<tspan class="text-sub" dy="3">1</tspan></text>
  <!-- n2 -->
  <text x="242" y="290" class="text-math">n<tspan class="text-sub" dy="3">2</tspan></text>


  <!-- ==================== RIGHT DIAGRAM (EDGE-ALIGNED PROJECTION) ==================== -->
  <!-- Shaded Dihedral Angle Sector phi -->
  <!-- Center: (550, 145), n1 direction: (-69, -48), n2 direction: (-45, 72) -->
  <!-- Radius 44: Arc from (514.5, 120.3) to (526.7, 182.3) -->
  <path d="M 550,145 L 514.5,120.3 A 44 44 0 0 0 526.7,182.3 Z" class="arc-sector" />

  <!-- Angle Label phi -->
  <text x="522" y="151" class="text-phi" text-anchor="middle">&#981;</text>

  <!-- Wing 1 segment: p1,2(550, 145) to p3(475, 245) -->
  <line x1="550" y1="145" x2="475" y2="245" class="edge-line" />

  <!-- Wing 2 segment: p1,2(550, 145) to p4(710, 245) -->
  <line x1="550" y1="145" x2="710" y2="245" class="edge-line" />

  <!-- Normal Vector n1: from (550, 145) to (481, 97) [perpendicular to wing 1] -->
  <line x1="550" y1="145" x2="486" y2="100" class="normal-vec" marker-end="url(#arrowHead)" />

  <!-- Normal Vector n2: from (550, 145) to (505, 217) [perpendicular to wing 2] -->
  <line x1="550" y1="145" x2="508" y2="212" class="normal-vec" marker-end="url(#arrowHead)" />

  <!-- Right Diagram Vertex Dots -->
  <circle cx="550" cy="145" class="pt-dot" />
  <circle cx="475" cy="245" class="pt-dot" />
  <circle cx="710" cy="245" class="pt-dot" />

  <!-- Right Diagram Labels -->
  <!-- p1,2 -->
  <text x="562" y="128" class="text-math">p<tspan class="text-sub" dy="3">1,2</tspan></text>
  <!-- p3 -->
  <text x="465" y="272" class="text-math">p<tspan class="text-sub" dy="3">3</tspan></text>
  <!-- p4 -->
  <text x="725" y="272" class="text-math">p<tspan class="text-sub" dy="3">4</tspan></text>
  <!-- n1 -->
  <text x="480" y="80" class="text-math">n<tspan class="text-sub" dy="3">1</tspan></text>
  <!-- n2 -->
  <text x="502" y="240" class="text-math">n<tspan class="text-sub" dy="3">2</tspan></text>
</svg>
