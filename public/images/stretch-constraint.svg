<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker for displacement vectors -->
    <marker id="arrowHead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1.5 L7.5,4.5 L1,7.5 Z" fill="#0f172a" />
    </marker>
  </defs>

  <style>
    .bg-card { fill: #fafafa; stroke: #e2e8f0; stroke-width: 1; rx: 12px; }
    .thin-edge { stroke: #0f172a; stroke-width: 1.8; stroke-linecap: round; }
    .thick-rest-edge { stroke: #0f172a; stroke-width: 6; stroke-linecap: round; }
    .delta-arrow { stroke: #0f172a; stroke-width: 1.8; stroke-linecap: round; }
    .pt-dot { r: 5.5; fill: #0f172a; }
    .text-math-bold { font-family: 'Newsreader', 'Times New Roman', Georgia, serif; font-weight: 700; font-size: 22px; fill: #0f172a; }
    .text-math-italic { font-family: 'Newsreader', 'Times New Roman', Georgia, serif; font-style: italic; font-size: 22px; fill: #0f172a; }
    .text-sub { font-family: 'Newsreader', 'Times New Roman', Georgia, serif; font-size: 14px; font-weight: 700; }
    .text-sub-italic { font-family: 'Newsreader', 'Times New Roman', Georgia, serif; font-size: 14px; font-style: italic; }
  </style>

  <!-- Container Box -->
  <rect x="4" y="4" width="752" height="232" class="bg-card" />

  <!-- Full Stretched Edge (p1 to p2) -->
  <line x1="160" y1="160" x2="600" y2="90" class="thin-edge" />

  <!-- Rest Length d Segment (Thick Solid Line) -->
  <line x1="280" y1="141" x2="480" y2="109" class="thick-rest-edge" />

  <!-- Rest Length d Label -->
  <text x="380" y="104" class="text-math-italic" text-anchor="middle">d</text>

  <!-- Displacement Vector Arrow Delta p1 (parallel above left segment) -->
  <line x1="165" y1="142" x2="270" y2="125" class="delta-arrow" marker-end="url(#arrowHead)" />
  <text x="212" y="116" class="text-math-bold" text-anchor="middle">&#916;p<tspan class="text-sub" dy="3">1</tspan></text>

  <!-- Displacement Vector Arrow Delta p2 (parallel above right segment) -->
  <line x1="595" y1="72" x2="490" y2="89" class="delta-arrow" marker-end="url(#arrowHead)" />
  <text x="548" y="62" class="text-math-bold" text-anchor="middle">&#916;p<tspan class="text-sub" dy="3">2</tspan></text>

  <!-- Particle 1 Dot & Labels -->
  <circle cx="160" cy="160" class="pt-dot" />
  <text x="126" y="166" class="text-math-italic" text-anchor="end">m<tspan class="text-sub-italic" dy="3">1</tspan></text>
  <text x="160" y="196" class="text-math-bold" text-anchor="middle">p<tspan class="text-sub" dy="3">1</tspan></text>

  <!-- Particle 2 Dot & Labels -->
  <circle cx="600" cy="90" class="pt-dot" />
  <text x="632" y="96" class="text-math-italic" text-anchor="start">m<tspan class="text-sub-italic" dy="3">2</tspan></text>
  <text x="600" y="126" class="text-math-bold" text-anchor="middle">p<tspan class="text-sub" dy="3">2</tspan></text>
</svg>
